<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mirante · APA do Pico do Goiapaba-Açu · Preservando o Nosso Quintal</title>
<meta name="theme-color" content="#0f1f38">
<style>
  :root{--azul:#1e4575;--verde:#18965f;--fundo:#0f1f38}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--fundo);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover;display:none}
  canvas{touch-action:none}
  .topo{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 22px;display:flex;align-items:center;gap:10px;
    background:linear-gradient(rgba(15,31,56,.85),rgba(15,31,56,0));pointer-events:none}
  .topo img{width:40px;background:#fff;border-radius:10px;padding:3px}
  .topo small{display:block;font-size:10px;letter-spacing:.12em;color:#5fe0a0;font-weight:800}
  .topo b{font-size:17px}
  .topo .rumo{margin-left:auto;text-align:right;font:800 18px system-ui;text-shadow:0 1px 3px #000}
  .topo .rumo span{display:block;font:600 11px system-ui;color:#c9d6ea}
  .barra{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(rgba(15,31,56,0),rgba(15,31,56,.9) 40%)}
  .barra button{border:0;border-radius:22px;padding:10px 14px;font:700 13.5px system-ui;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
  .barra button.prin{background:#fff;color:var(--azul)}
  .local{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));font:600 11.5px system-ui;background:rgba(15,31,56,.7);padding:5px 11px;border-radius:14px;white-space:nowrap;pointer-events:none}
  .dica{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));font:600 12.5px system-ui;background:rgba(15,31,56,.8);padding:7px 12px;border-radius:14px;text-align:center;max-width:90vw;pointer-events:none;transition:opacity .5s}
  .ficha{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));background:#fff;color:#1e4575;border-radius:18px;padding:14px 16px;display:none;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .ficha b{font-size:18px;display:block}
  .ficha p{margin:4px 0 0;font-size:13.5px;color:#3a4a6b;line-height:1.45}
  .ficha .x{position:absolute;right:10px;top:8px;border:0;background:#eee;border-radius:50%;width:28px;height:28px;font-size:15px;color:#1e4575}
  #carregando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 15px system-ui;color:#c9d6ea;background:var(--fundo);z-index:9}
</style>
</head>
<body>
<div id="carregando">Calculando o horizonte…</div>
<video id="video" playsinline muted autoplay></video>
<canvas id="tela"></canvas>
<div class="topo">
  <img src="../../passaporte/logo.png" alt="">
  <div><small>PRESERVANDO O NOSSO QUINTAL</small><b>Mirante do Goiapaba-Açu</b></div>
  <div class="rumo" id="rumo">—<span>direção</span></div>
</div>
<div class="local" id="local"></div>
<div class="dica" id="dica">Arraste para olhar em volta · use dois dedos para aproximar</div>
<div class="ficha" id="ficha"><button class="x" onclick="fecharFicha()">×</button><b id="fNome"></b><p id="fTxt"></p></div>
<div class="barra">
  <button class="prin" id="bCam">📷 Ver pela câmera</button>
  <button id="bGps">📍 Usar minha posição</button>
  <button id="bAjuste" style="display:none">↔ Ajustar</button>
</div>

<script>
/* ======================= configuração ======================= */
const MIRANTE={nome:'Mirante do Goiapaba-Açu',lon:-40.4722,lat:-19.9152};
const DECLINACAO=-24;          // declinação magnética aproximada no centro do ES (graus)
const ALCANCE=45000;           // metros
const PASSO_AZ=0.2;            // graus
const FAIXAS=[2500,7000,16000,ALCANCE];   // linhas de cristas (perto → longe)
const R_TERRA=6371000, K_REFR=0.13;

/* ======================= estado ======================= */
let D, Z, viewer, horiz, faixas, alvos=[], limiteProj=[], mar=null;
let modo='panorama', rumo=90, inclina=-1, roll=0, fovH=48;         // câmera virtual / real
let ajusteRumo=0, ajusteIncl=0, fovCam=null;
try{ajusteRumo=+localStorage.getItem('mir-aj-r')||0; ajusteIncl=+localStorage.getItem('mir-aj-i')||0}catch(e){}
const cv=document.getElementById('tela'), cx=cv.getContext('2d'), video=document.getElementById('video');
const rad=Math.PI/180, deg=180/Math.PI;

/* ======================= dados ======================= */
Promise.all([fetch('dados.json').then(r=>r.json()), new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src='relevo.png'})]).then(([d,img])=>{
  D=d; const c=document.createElement('canvas');c.width=d.w;c.height=d.h;const x=c.getContext('2d');x.drawImage(img,0,0);
  const px=x.getImageData(0,0,d.w,d.h).data; Z=new Float32Array(d.w*d.h);
  for(let i=0;i<Z.length;i++)Z[i]=px[i*4]*256+px[i*4+1];
  posicionar(MIRANTE.lon,MIRANTE.lat,null);
  document.getElementById('carregando').remove(); tamanho(); requestAnimationFrame(desenhar);
});
function alt(lon,lat){ // bilinear
  const fx=(lon-D.x0)/D.dx-.5, fy=(D.y0-lat)/D.dy-.5; const x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0;
  if(x0<0||y0<0||x0>=D.w-1||y0>=D.h-1)return 0; const i=y0*D.w+x0;
  return (Z[i]*(1-tx)+Z[i+1]*tx)*(1-ty)+(Z[i+D.w]*(1-tx)+Z[i+D.w+1]*tx)*ty;
}
function dentroDEM(lon,lat){return lon>D.x0+.05&&lon<D.x0+D.w*D.dx-.05&&lat<D.y0-.05&&lat>D.y0-D.h*D.dy+.05}
function dentroAPA(lon,lat){let d=false;const a=D.limite;for(let i=0,j=a.length-1;i<a.length;j=i++){const[xi,yi]=a[i],[xj,yj]=a[j];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)d=!d}return d}

/* ======================= horizonte ======================= */
function posicionar(lon,lat,acc){
  const h0=alt(lon,lat)+1.7; viewer={lon,lat,h0,acc,kx:111320*Math.cos(lat*rad),ky:110574};
  const N=Math.round(360/PASSO_AZ); horiz=new Float32Array(N); faixas=FAIXAS.map(()=>new Float32Array(N)); const far=new Float32Array(N), farMar=new Uint8Array(N);
  for(let k=0;k<N;k++){const az=k*PASSO_AZ*rad,se=Math.sin(az),co=Math.cos(az);let m=-90,b=0,dm=0,zm=1;
    for(let d=50;d<=ALCANCE;d+=Math.max(40,d*0.008)){
      const lo=lon+se*d/viewer.kx, la=lat+co*d/viewer.ky, h=alt(lo,la)-d*d/(2*R_TERRA)*(1-K_REFR);
      const a=Math.atan2(h-h0,d)*deg; if(a>m){m=a;dm=d;zm=alt(lo,la)}
      while(b<FAIXAS.length&&d>FAIXAS[b]){faixas[b][k]=m;b++}
    }
    for(;b<FAIXAS.length;b++)faixas[b][k]=m; horiz[k]=m; far[k]=dm; farMar[k]=zm<3&&dm>15000?1:0;}
  // trecho de mar visível mais longo
  let best=null,ini=-1;for(let k=0;k<=N;k++){const v=k<N&&farMar[k];if(v&&ini<0)ini=k;if(!v&&ini>=0){if(!best||k-ini>best[1]-best[0])best=[ini,k];ini=-1}}
  mar=best&&best[1]-best[0]>20?{az:(best[0]+best[1])/2*PASSO_AZ,ang:horiz[Math.round((best[0]+best[1])/2)%N]}:null;
  // picos e cidades visíveis
  alvos=[];
  for(const[tipo,nome,la,lo,ele]of D.nomes){
    const e=(lo-lon)*viewer.kx,n=(la-lat)*viewer.ky,dist=Math.hypot(e,n); if(dist<250||dist>ALCANCE)continue;
    let h=alt(lo,la); if(tipo==='pico'){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)h=Math.max(h,alt(lo+dx*D.dx,la+dy*D.dy))}
    const hc=h-dist*dist/(2*R_TERRA)*(1-K_REFR), ang=Math.atan2(hc+(tipo==='pico'?2:15)-viewer.h0,dist)*deg, az=(Math.atan2(e,n)*deg+360)%360;
    // linha de visada
    let vis=true;const se=e/dist,co=n/dist;for(let d=60;d<dist-120;d+=Math.max(40,d*0.008)){const hh=alt(lon+se*d/viewer.kx,lat+co*d/viewer.ky)-d*d/(2*R_TERRA)*(1-K_REFR);if(Math.atan2(hh-viewer.h0,d)*deg>ang+0.03){vis=false;break}}
    if(!vis)continue;
    if(tipo==='pico'&&h<200&&!dentroAPA(lo,la))continue;
    alvos.push({tipo,nome,lat:la,lon:lo,ele:ele||Math.round(h),dist,az,ang,apa:dentroAPA(lo,la)});
  }
  alvos.sort((a,b)=>(b.tipo==='pico')-(a.tipo==='pico')||b.ele-a.ele);
  // limite da APA no terreno
  limiteProj=D.limite.map(([lo,la])=>{const e=(lo-lon)*viewer.kx,n=(la-lat)*viewer.ky,dist=Math.hypot(e,n)||1,h=alt(lo,la)+3-dist*dist/(2*R_TERRA)*(1-K_REFR);
    const ang=Math.atan2(h-viewer.h0,dist)*deg;let vis=true;const se=e/dist,co=n/dist;
    for(let d=60;d<dist-90;d+=Math.max(40,d*0.008)){const hh=alt(lon+se*d/viewer.kx,lat+co*d/viewer.ky)-d*d/(2*R_TERRA)*(1-K_REFR);if(Math.atan2(hh-viewer.h0,d)*deg>ang+0.05){vis=false;break}}
    return{az:(Math.atan2(e,n)*deg+360)%360,ang,vis,dist}});
  const dentro=dentroAPA(lon,lat);
  document.getElementById('local').textContent=(acc==null?MIRANTE.nome+' · '+Math.round(viewer.h0-1.7)+' m':'Sua posição ±'+Math.round(acc)+' m · '+Math.round(viewer.h0-1.7)+' m')+(dentro?' · dentro da APA':'');
}

/* ======================= projeção ======================= */
let base; // vetores da câmera em coordenadas Leste-Norte-Cima
function camVirtual(){const h=rumo*rad,p=inclina*rad;
  const f=[Math.sin(h)*Math.cos(p),Math.cos(h)*Math.cos(p),Math.sin(p)],r=[Math.cos(h),-Math.sin(h),0];
  const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
  const W=cv.width,fpx=(W/2)/Math.tan(fovH/2*rad);base={f,r,u,fpx};}
function proj(az,ang){const a=az*rad,e=ang*rad,v=[Math.sin(a)*Math.cos(e),Math.cos(a)*Math.cos(e),Math.sin(e)];
  const zf=v[0]*base.f[0]+v[1]*base.f[1]+v[2]*base.f[2]; if(zf<=0.05)return null;
  const xr=v[0]*base.r[0]+v[1]*base.r[1]+v[2]*base.r[2], yu=v[0]*base.u[0]+v[1]*base.u[1]+v[2]*base.u[2];
  return [cv.width/2+base.fpx*xr/zf, cv.height/2-base.fpx*yu/zf];}

/* ======================= desenho ======================= */
const PR=Math.min(devicePixelRatio||1,2);
function tamanho(){cv.width=innerWidth*PR;cv.height=innerHeight*PR}
addEventListener('resize',tamanho);
const CORES=['#7aa08a','#5d8a76','#4a7464','#3b5f53'];  // longe → perto (panorama)
let caixas=[];
function desenhar(){
  requestAnimationFrame(desenhar); if(!horiz)return;
  if(modo==='camera')camReal(); else camVirtual();
  const W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);
  const N=horiz.length;
  // faixa de azimutes visível
  const span=(modo==='camera'?Math.max(fovH,40):fovH)*0.75+10, centro=modo==='camera'?rumoAtual:rumo;
  const k0=Math.floor((centro-span)/PASSO_AZ), k1=Math.ceil((centro+span)/PASSO_AZ);
  const linha=(arr)=>{const pts=[];for(let k=k0;k<=k1;k++){const kk=((k%N)+N)%N,p=proj(k*PASSO_AZ,arr[kk]);if(p)pts.push(p)}return pts};
  if(modo!=='camera'){ // céu e montanhas preenchidas
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b5b93');g.addColorStop(.55,'#9cc4e4');g.addColorStop(.62,'#dfe9ef');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    for(let b=faixas.length-1;b>=0;b--){const p=linha(faixas[b]);if(p.length<2)continue;cx.beginPath();cx.moveTo(p[0][0],H);p.forEach(q=>cx.lineTo(q[0],q[1]));cx.lineTo(p[p.length-1][0],H);cx.closePath();cx.fillStyle=CORES[faixas.length-1-b];cx.fill()}
  }
  // cristas
  for(let b=faixas.length-2;b>=0;b--){const p=linha(faixas[b]);cx.beginPath();p.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
    cx.strokeStyle=modo==='camera'?'rgba(255,255,255,.55)':'rgba(255,255,255,.35)';cx.lineWidth=1.3*PR;cx.stroke()}
  const ph=linha(horiz);cx.beginPath();ph.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
  cx.strokeStyle='#fff';cx.lineWidth=2.6*PR;cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=4*PR;cx.stroke();cx.shadowBlur=0;
  // limite da APA
  cx.strokeStyle='#5fe0a0';cx.lineWidth=2.4*PR;cx.setLineDash([7*PR,5*PR]);
  for(let i=0;i<limiteProj.length-1;i++){const a=limiteProj[i],b=limiteProj[i+1];if(!a.vis||!b.vis||Math.abs(a.az-b.az)>40)continue;const p=proj(a.az,a.ang),q=proj(b.az,b.ang);if(!p||!q)continue;cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke()}
  cx.setLineDash([]);
  // rótulos
  caixas=[];const ocup=[];const fonte=12*PR;cx.textBaseline='middle';
  const tenta=(o,titulo,sub,cor)=>{const p=proj(o.az,o.ang);if(!p||p[0]<-50||p[0]>W+50)return;
    cx.font=`800 ${fonte}px system-ui`;const w=Math.max(cx.measureText(titulo).width,(cx.font=`600 ${fonte*.85}px system-ui`,cx.measureText(sub).width))+14*PR,h=fonte*2.5;
    let y=p[1]-28*PR-h,lv=0;
    while(ocup.some(r=>!(p[0]+w/2<r[0]||p[0]-w/2>r[2]||y+h<r[1]||y>r[3]))&&lv<6){y-=h+4*PR;lv++}
    if(lv>=6||y<70*PR)return; ocup.push([p[0]-w/2,y,p[0]+w/2,y+h]);
    cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=1.2*PR;cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(p[0],y+h);cx.stroke();
    cx.fillStyle=cor;cx.beginPath();cx.arc(p[0],p[1],3.5*PR,0,7);cx.fill();
    cx.fillStyle='rgba(15,31,56,.82)';rr(p[0]-w/2,y,w,h,8*PR);cx.fill();
    cx.fillStyle=cor;cx.fillRect(p[0]-w/2,y+h-3*PR,w,3*PR);
    cx.textAlign='center';cx.fillStyle='#fff';cx.font=`800 ${fonte}px system-ui`;cx.fillText(titulo,p[0],y+h*.36);
    cx.fillStyle='#c9d6ea';cx.font=`600 ${fonte*.85}px system-ui`;cx.fillText(sub,p[0],y+h*.72);
    caixas.push({o,x0:p[0]-w/2,y0:y,x1:p[0]+w/2,y1:y+h});};
  let n=0;for(const o of alvos){if(n>=18)break;const km=o.dist<1000?Math.round(o.dist)+' m':(o.dist/1000).toFixed(o.dist<10000?1:0).replace('.',',')+' km';
    const before=caixas.length;tenta(o,o.nome,(o.tipo==='pico'?o.ele+' m · ':'')+km,o.tipo==='pico'?(o.apa?'#5fe0a0':'#ffd27a'):'#7fc8ff');if(caixas.length>before)n++;}
  if(mar)tenta({az:mar.az,ang:mar.ang,mar:1,nome:'Oceano Atlântico'},'Oceano Atlântico','mar no horizonte','#7fc8ff');
  // rumo
  const c=((centro%360)+360)%360,pontos=['N','NE','L','SE','S','SO','O','NO'];
  document.getElementById('rumo').innerHTML=Math.round(c)+'° '+pontos[Math.round(c/45)%8]+'<span>direção</span>';
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}

/* ======================= interação ======================= */
let arrasto=null, toques=new Map();
cv.addEventListener('pointerdown',e=>{toques.set(e.pointerId,[e.clientX,e.clientY]);arrasto={x:e.clientX,y:e.clientY,r:rumo,i:inclina,ar:ajusteRumo,ai:ajusteIncl,mov:0,fov:fovH};});
cv.addEventListener('pointermove',e=>{if(!arrasto)return;toques.set(e.pointerId,[e.clientX,e.clientY]);
  if(toques.size===2&&modo!=='camera'){const[p1,p2]=[...toques.values()],d=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]);if(!arrasto.d0)arrasto.d0=d;fovH=Math.max(15,Math.min(110,arrasto.fov*arrasto.d0/d));arrasto.mov=99;return}const dx=e.clientX-arrasto.x,dy=e.clientY-arrasto.y;arrasto.mov=Math.max(arrasto.mov,Math.hypot(dx,dy));
  const gpp=fovH/innerWidth;
  if(modo==='camera'){ajusteRumo=arrasto.ar-dx*gpp;ajusteIncl=arrasto.ai+dy*gpp}
  else{rumo=arrasto.r-dx*gpp;inclina=Math.max(-25,Math.min(25,arrasto.i+dy*gpp))}
  document.getElementById('dica').style.opacity=0;});
cv.addEventListener('pointerup',e=>{toques.delete(e.pointerId);if(toques.size){return}if(arrasto&&arrasto.mov<8)tocar(e.clientX*PR,e.clientY*PR);
  if(modo==='camera'){try{localStorage.setItem('mir-aj-r',ajusteRumo);localStorage.setItem('mir-aj-i',ajusteIncl)}catch(_){}}arrasto=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();fovH=Math.max(20,Math.min(110,fovH*(e.deltaY>0?1.08:.92)))},{passive:false});
function tocar(x,y){const c=caixas.find(c=>x>=c.x0&&x<=c.x1&&y>=c.y0&&y<=c.y1);if(!c)return fecharFicha();const o=c.o;
  if(o.mar){abrirFicha('Oceano Atlântico','Daqui de cima dá para ver o mar no horizonte. A água dos córregos da APA desce pelos rios até chegar nele.');return}
  const dir=['norte','nordeste','leste','sudeste','sul','sudoeste','oeste','noroeste'][Math.round(o.az/45)%8];
  abrirFicha(o.nome,(o.tipo==='pico'?`${o.ele} m de altitude · `:'')+`${(o.dist/1000).toFixed(1).replace('.',',')} km a ${dir}`+(o.apa?' · dentro da APA do Pico do Goiapaba-Açu':''));}
function abrirFicha(t,x){document.getElementById('fNome').textContent=t;document.getElementById('fTxt').textContent=x;document.getElementById('ficha').style.display='block'}
function fecharFicha(){document.getElementById('ficha').style.display='none'}

/* ======================= GPS ======================= */
document.getElementById('bGps').onclick=()=>{
  if(!navigator.geolocation)return aviso('Este aparelho não informa a localização.');
  aviso('Procurando sua posição…');
  navigator.geolocation.getCurrentPosition(p=>{const{longitude:lo,latitude:la,accuracy:ac}=p.coords;
    if(!D||!dentroDEM(lo,la)){aviso('Você está longe da APA. Mostrando a vista do Mirante.');return}
    posicionar(lo,la,ac);aviso('Vista calculada a partir de onde você está.');},()=>aviso('Não consegui a localização. Mostrando a vista do Mirante.'),{enableHighAccuracy:true,timeout:15000});
};
function aviso(t){const d=document.getElementById('dica');d.textContent=t;d.style.opacity=1;clearTimeout(aviso.t);aviso.t=setTimeout(()=>d.style.opacity=0,4500)}

/* ======================= câmera + bússola ======================= */
let ori=null, rumoAtual=90, heading=null;
document.getElementById('bCam').onclick=async()=>{
  if(modo==='camera'){sairCamera();return}
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('sensores')}
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=s;video.style.display='block';await video.play();
  }catch(e){aviso('Não foi possível abrir a câmera e a bússola. Use a vista panorâmica arrastando a tela.');return}
  const ev='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';
  addEventListener(ev,e=>{ori=e},true);
  modo='camera';document.getElementById('bCam').textContent='🗺 Vista panorâmica';document.getElementById('bAjuste').style.display='';
  aviso('Aponte para as montanhas. Se a linha branca não encaixar no horizonte, arraste a tela para os lados.');
  if(!document.getElementById('bGps').dataset.f){document.getElementById('bGps').dataset.f=1;document.getElementById('bGps').click()}
};
document.getElementById('bAjuste').onclick=()=>{ajusteRumo=0;ajusteIncl=0;try{localStorage.removeItem('mir-aj-r');localStorage.removeItem('mir-aj-i')}catch(_){}aviso('Ajuste zerado. Arraste para os lados para encaixar o horizonte.')};
function sairCamera(){modo='panorama';const s=video.srcObject;if(s)s.getTracks().forEach(t=>t.stop());video.style.display='none';
  document.getElementById('bCam').textContent='📷 Ver pela câmera';document.getElementById('bAjuste').style.display='none';rumo=rumoAtual;inclina=-1;fovH=48}
function camReal(){
  if(!ori||ori.alpha==null){camVirtual();return}
  // matriz de rotação do aparelho (W3C: Z·X·Y), em Leste-Norte-Cima
  const a=ori.alpha*rad,b=ori.beta*rad,g=ori.gamma*rad,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const M=[[ca*cg-sa*sb*sg,-cb*sa,ca*sg+cg*sa*sb],[cg*sa+ca*sb*sg,ca*cb,sa*sg-ca*cg*sb],[-cb*sg,sb,cb*cg]];
  const mul=v=>[M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2],M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2],M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2]];
  let ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0; ang*=rad;
  // eixos da tela considerando a rotação da tela
  const rx=[Math.cos(ang),-Math.sin(ang),0], uy=[Math.sin(ang),Math.cos(ang),0];
  let f=mul([0,0,-1]),r=mul(rx),u=mul(uy);
  // rumo: iOS dá a bússola pronta; Android usa o alfa absoluto
  let hCalc=(Math.atan2(f[0],f[1])*deg+360)%360, hAlvo=hCalc;
  if(ori.webkitCompassHeading!=null)hAlvo=ori.webkitCompassHeading+DECLINACAO;
  else if(ori.absolute)hAlvo=hCalc+DECLINACAO;
  hAlvo+=ajusteRumo;
  // suaviza
  if(heading==null)heading=hAlvo; let dh=((hAlvo-heading+540)%360)-180; heading+=dh*0.25;
  const rot=(heading-hCalc)*rad, cr=Math.cos(rot),sr=Math.sin(rot);
  const gira=v=>[v[0]*cr+v[1]*sr,-v[0]*sr+v[1]*cr,v[2]];  // gira em torno do eixo vertical (sentido horário)
  f=gira(f);r=gira(r);u=gira(u);
  // ajuste de inclinação
  if(ajusteIncl){const t=ajusteIncl*rad,ct=Math.cos(t),st=Math.sin(t);const f2=f.map((x,i)=>x*ct+u[i]*st),u2=u.map((x,i)=>u[i]*ct-f[i]*st);f=f2;u=u2}
  // campo de visão da câmera recortada na tela
  const vw=video.videoWidth||1080,vh=video.videoHeight||1920,W=cv.width,H=cv.height,s=Math.max(W/vw,H/vh);
  const longo=66*rad, tanL=Math.tan(longo/2), tanC=tanL*Math.min(vw,vh)/Math.max(vw,vh);
  const tanX=(vw>=vh?tanL:tanC)*(W/(vw*s));
  fovH=2*Math.atan(tanX)*deg; base={f,r,u,fpx:(W/2)/tanX}; rumoAtual=heading;
}
