<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Livro vivo – Realidade Aumentada</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #inicio {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 30%, #2f5a2a, #10200f); color: #fff;
  }
  #inicio h1 { margin: 0; font-size: 1.6rem; color: #fbbf3a; }
  #inicio p { margin: 0; max-width: 320px; line-height: 1.4; opacity: .9; }
  .btn {
    font-size: 1.1rem; font-weight: 700; padding: 14px 28px; border: 0; border-radius: 40px;
    background: #fbbf3a; color: #10200f;
  }
  #dica {
    position: fixed; left: 0; right: 0; bottom: 24px; z-index: 5; text-align: center; color: #fff;
    font-size: .95rem; text-shadow: 0 1px 4px #000; display: none;
  }
  #erro {
    position: fixed; left: 16px; right: 16px; top: 40%; z-index: 20; display: none; padding: 18px;
    border-radius: 14px; background: #fff; color: #10200f; font-size: 1rem; line-height: 1.4; text-align: center;
  }
  #som {
    position: fixed; top: 16px; right: 16px; z-index: 6; display: none;
    font-size: 1rem; padding: 10px 16px;
  }
</style>
</head>
<body>
<div id="inicio">
  <h1>📱 Livro vivo</h1>
  <p>Toque em <b>Começar</b>, permita o uso da câmera e aponte o celular para uma página com o selo de realidade aumentada. Para páginas duplas, segure o celular na horizontal.</p>
  <button class="btn" id="btn">Começar</button>
</div>
<div id="dica">Aponte para a foto da página impressa</div>
<div id="erro"></div>
<button class="btn" id="som">🔇 Ativar som</button>

<a-scene
  mindar-image="imageTargetSrc: ./livro.mind; maxTrack: 1; autoStart: false; uiScanning: no; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="v0" src="./repteis.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    <video id="v2" src="./mamiferos.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    <video id="v3" src="./servicos.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    <video id="v1" src="./aves.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- 0: Répteis (página dupla) — proporção 1424/2398 -->
  <a-entity class="alvo" data-video="v0" mindar-image-target="targetIndex: 0">
    <a-video src="#v0" width="1" height="0.5938" position="0 0 0.001"></a-video>
  </a-entity>
  <!-- 1: Aves (benedito-de-testa-amarela) — proporção 2128/1700 -->
  <a-entity class="alvo" data-video="v1" mindar-image-target="targetIndex: 1">
    <a-video src="#v1" width="1" height="1.2518" position="0 0 0.001"></a-video>
  </a-entity>
  <!-- 2: Mamíferos (página dupla, preguiça) — proporção 720/1204 -->
  <a-entity class="alvo" data-video="v2" mindar-image-target="targetIndex: 2">
    <a-video src="#v2" width="1" height="0.598" position="0 0 0.001"></a-video>
  </a-entity>
  <!-- 3: Serviços ambientais e ecossistêmicos (página dupla, sabiá) — proporção 720/1228 -->
  <a-entity class="alvo" data-video="v3" mindar-image-target="targetIndex: 3">
    <a-video src="#v3" width="1" height="0.5863" position="0 0 0.001"></a-video>
  </a-entity>
</a-scene>

<script>
  const videos = [...document.querySelectorAll('video')];
  const dica = document.getElementById('dica');
  const som = document.getElementById('som');
  let comSom = false;

  const erro = document.getElementById('erro');
  function mostrarErro(msg) { erro.textContent = msg; erro.style.display = 'block'; dica.style.display = 'none'; }
  window.addEventListener('error', e => mostrarErro('Erro: ' + (e.message || e)));
  window.addEventListener('unhandledrejection', e => mostrarErro('Erro: ' + (e.reason && e.reason.message || e.reason)));

  const scene = document.querySelector('a-scene');
  scene.addEventListener('arReady', () => { dica.textContent = 'Aponte para a foto da página impressa'; });
  scene.addEventListener('arError', () => mostrarErro('Não foi possível abrir a câmera. Verifique se o navegador tem permissão para usar a câmera e abra o link direto no Safari ou no Chrome (não dentro do WhatsApp/Instagram).'));

  document.getElementById('btn').addEventListener('click', () => {
    document.getElementById('inicio').style.display = 'none';
    dica.textContent = 'Abrindo a câmera…';
    dica.style.display = 'block';
    som.style.display = 'block';
    // desbloqueia os vídeos no iPhone (precisa ocorrer no toque, sem esperar)
    videos.forEach(v => { const pr = v.play(); if (pr) pr.then(() => { v.pause(); v.currentTime = 0; }).catch(() => {}); });
    const iniciar = () => {
      try { scene.systems['mindar-image-system'].start(); }
      catch (e) { mostrarErro('Erro ao iniciar a realidade aumentada: ' + e.message); }
    };
    if (scene.hasLoaded) iniciar(); else scene.addEventListener('loaded', iniciar);
  });

  // Ao girar o celular, a câmera muda de proporção: reinicia a RA para recalcular o encaixe
  let rodando = false, horizontalInicial = null, timerGiro = null;
  const ehHorizontal = () => window.innerWidth > window.innerHeight;
  scene.addEventListener('arReady', () => { rodando = true; horizontalInicial = ehHorizontal(); });
  window.addEventListener('resize', () => {
    clearTimeout(timerGiro);
    timerGiro = setTimeout(() => {
      if (!rodando || ehHorizontal() === horizontalInicial) return;
      rodando = false;
      const sys = scene.systems['mindar-image-system'];
      videos.forEach(v => { v.pause(); v.currentTime = 0; });
      dica.textContent = 'Ajustando a câmera…'; dica.style.display = 'block';
      // esconde as páginas para o vídeo recomeçar quando forem reconhecidas de novo
      document.querySelectorAll('.alvo').forEach(a => { try { a.components['mindar-image-target'].updateWorldMatrix(null); } catch (e) {} });
      try { sys.stop(); } catch (e) {}
      setTimeout(() => { try { sys.start(); } catch (e) { mostrarErro('Erro ao reiniciar: ' + e.message); } }, 400);
    }, 600);
  });

  som.addEventListener('click', () => {
    comSom = !comSom;
    videos.forEach(v => v.muted = !comSom);
    som.textContent = comSom ? '🔊 Som ligado' : '🔇 Ativar som';
  });

  // ao encontrar a página: começa do início e repete sem parar; ao perder: pausa e volta ao início
  document.querySelectorAll('.alvo').forEach(alvo => {
    const v = document.getElementById(alvo.dataset.video);
    alvo.addEventListener('targetFound', () => { dica.style.display = 'none'; v.currentTime = 0; v.muted = !comSom; v.play(); });
    alvo.addEventListener('targetLost', () => { dica.style.display = 'block'; v.pause(); v.currentTime = 0; });
  });
</script>
</body>
</html>
